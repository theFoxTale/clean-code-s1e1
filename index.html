<!DOCTYPE html>
<html lang="en">
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen">
</head>
<body class="container">
  <figure class="image-wrapper">
    <img
        class="header-image"
        src="./assets/eisenhower-matrix.jpg"
        alt="Eisenhower Matrix diagram showing four quadrants for task prioritization"
    />
    <figcaption>
      <a
          class="details-link"
          target="_blank"
          href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?</a>
    </figcaption>
  </figure>

  <main class="content-wrapper">
    <section>
      <h3 class="list-header">Add Item</h3>
      <div class="task-wrapper">
        <label for="new-task" class="hidden-label">New task description</label>
        <input type="text" id="new-task" class="task-input">
        <button class="add-button">Add</button>
      </div>
    </section>

    <section>
      <h3 class="list-header">Todo</h3>
      <ul id="uncompleted-tasks" class="tasks-list">
        <li class="one-task">
          <label class="task-label">
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">Pay Bills</span>
            <input type="text" class="task-input">
          </label>
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img class="remove-image" src="./assets/remove.svg" alt="delete this task">
          </button>
        </li>

        <li class="one-task edit-mode">
          <label class="task-label">
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">Go Shopping</span>
            <input type="text" value="Go Shopping" class="task-input">
          </label>
          <button class="edit-button">Save</button>
          <button class="delete-button">
            <img class="remove-image" src="./assets/remove.svg" alt="delete this task">
          </button>
        </li>
      </ul>
    </section>

    <section>
      <h3 class="list-header">Completed</h3>
      <ul id="completed-tasks" class="tasks-list">
        <li class="one-task">
          <label class="task-label">
            <input type="checkbox" class="task-checkbox" checked>
            <span class="task-text">See the Doctor</span>
            <input type="text" class="task-input">
          </label>
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img class="remove-image" src="./assets/remove.svg" alt="delete this task">
          </button>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
